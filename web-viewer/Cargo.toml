[package]
name = "web-viewer"
version = "0.1.0"
edition = "2021"

[package.metadata.eonos]
id = "web-viewer"
type = "ERA"
name = "Web Fetch Viewer"
description = "Fetch and read simple web pages"

[dependencies]
eonos-app = { path = "../../userland/app-sdk" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = 2
